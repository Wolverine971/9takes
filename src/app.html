<!-- src/app.html -->
<!doctype html>
<html lang="en-US" class="dark">
	<head>
		<meta charset="utf-8" />
		<!-- Cold Light is dark only (2026-11-05): no theme bootstrap, no light mode. -->
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#01010D" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/brand/favicon-nine-mask-32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="%sveltekit.assets%/brand/favicon-nine-mask-16x16.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="48x48"
			href="%sveltekit.assets%/brand/favicon-nine-mask-48x48.png"
		/>
		<link rel="icon" type="image/x-icon" href="%sveltekit.assets%/favicon-nine-mask.ico" />
		<link rel="alternate" type="application/rss+xml" href="https://9takes.com/rss.xml" />
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
